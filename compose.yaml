# Minimal native aiwr service example.
#
# This file is a convenience wrapper around the Go core image. It is not a
# MarkLLM/MarkDiffusion/CtrlRegen/SynthID research stack. Those are optional
# third-party backends and are not built, pulled, or maintained by this file.
#
# If the published image is already available locally, run:
#   docker compose up -d
# To build the native image locally:
#   docker compose build

name: aiwr

services:
  aiwr:
    build:
      context: .
      dockerfile: service/Dockerfile
    image: ghcr.io/ifloppy/aiwr:latest
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      WATERMARKS_SERVER_API_KEY: ${WATERMARKS_SERVER_API_KEY:-}
      WATERMARKS_MAX_BATCH_FILES: ${WATERMARKS_MAX_BATCH_FILES:-50}
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
