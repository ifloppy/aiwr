# Dependabot configuration (https://docs.github.com/code-security/dependabot)
version: 2
updates:
  # GitHub Actions: keeps workflow action references fresh. Dependabot opens
  # PRs only; this repository has no automatic merge policy.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Python is used by the maintained tests/reference adapters, not by the
  # native release runtime.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  # Go module dependencies used by the native CLI and server.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # The only maintained Docker runtime is the native Go core image. Track its
  # base images without reintroducing dependency management for removed ML
  # backend images.
  - package-ecosystem: "docker"
    directory: "/service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
