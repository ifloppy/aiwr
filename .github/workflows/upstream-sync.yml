name: Upstream sync watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read upstream main
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/guillaumemeyer/watermarks-remover.git refs/heads/main | awk '{print $1}')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Update tracking pointer
        id: update
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.upstream.outputs.sha }}"
          old="$(sed -n 's/^upstream_head: *//p' UPSTREAM.md | head -n1)"
          if [[ "$old" == "$sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/update-upstream-ref.sh "$sha"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The repository policy currently allows GITHUB_TOKEN to push branches but
      # does not allow Actions to create pull requests. Publish the handoff
      # branch directly so the scheduled watcher remains green and a maintainer
      # can open the review PR from the summary link.
      - name: Publish sync branch
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM.md UPSTREAM.zh-CN.md
          git commit -m "chore: track upstream ${{ steps.upstream.outputs.sha }}"

          remote_ref="refs/remotes/origin/automation/upstream-sync"
          if git fetch origin "refs/heads/automation/upstream-sync:${remote_ref}"; then
            expected="$(git rev-parse "${remote_ref}")"
          else
            expected="0000000000000000000000000000000000000000"
          fi
          git push --force-with-lease="refs/heads/automation/upstream-sync:${expected}" \
            origin HEAD:refs/heads/automation/upstream-sync

      - name: Report manual sync PR handoff
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          {
            echo "### Upstream sync branch published"
            echo
            echo "Actions PR creation is disabled by the repository policy."
            echo "Open the review PR manually from the automation/upstream-sync branch:"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/automation/upstream-sync?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
