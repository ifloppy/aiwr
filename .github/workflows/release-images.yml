name: release-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-core:
    name: Build native Go image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Compute image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid release tag: ${TAG}" >&2
              exit 1
            fi
            echo "push=true" >> "$GITHUB_OUTPUT"
            if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::12}"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:manual-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: service/Dockerfile
          push: ${{ steps.image.outputs.push }}
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
